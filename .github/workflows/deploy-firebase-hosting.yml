name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-keiazotilt
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify application
        run: |
          npm test
          npm run check

      - name: Configure Firebase project
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEIAZOTILT }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          if (!account.project_id) throw new Error('The Firebase service account has no project_id.');
          const config = {
            projects: { default: account.project_id },
            targets: {
              [account.project_id]: {
                hosting: { keiazotilt: ['keiazotilt'] }
              }
            }
          };
          fs.writeFileSync('.firebaserc', `${JSON.stringify(config, null, 2)}\n`);
          const credentialsPath = path.join(process.env.RUNNER_TEMP, 'firebase-service-account.json');
          fs.writeFileSync(credentialsPath, `${JSON.stringify(account)}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_PROJECT_ID=${account.project_id}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${credentialsPath}\n`);
          NODE

      - name: Deploy live presence rules when available
        continue-on-error: true
        run: npx --yes firebase-tools deploy --only database --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Stripe checkout functions
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_SECRET_KEY is not configured for this repository; skipping Stripe functions deployment."
            exit 0
          fi
          trap 'rm -f functions/.env' EXIT
          printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" > functions/.env
          npx --yes firebase-tools@latest deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Stamp deployment
        run: printf '%s\n' "$GITHUB_SHA" > public/deploy-version.txt

      - name: Deploy keiazotilt
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEIAZOTILT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: keiazotilt
          channelId: live

      - name: Verify iphonesolo.com custom domain
        run: |
          for attempt in $(seq 1 18); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://iphonesolo.com/deploy-version.txt?sha=${GITHUB_SHA}" || true)"
            root_html="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://iphonesolo.com/?sha=${GITHUB_SHA}" || true)"
            code_html="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://iphonesolo.com/code?sha=${GITHUB_SHA}" || true)"
            if [ "$marker" = "$GITHUB_SHA" ] \
              && printf '%s' "$root_html" | grep -Fq '<title>iPhone Solo</title>' \
              && printf '%s' "$code_html" | grep -Fq '<title>Get the code · iPhone Solo</title>'; then
              echo "iphonesolo.com is serving commit ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for iphonesolo.com to serve ${GITHUB_SHA} (attempt ${attempt}/18)..."
            sleep 10
          done
          echo "iphonesolo.com did not serve the deployed commit within the verification window."
          exit 1
