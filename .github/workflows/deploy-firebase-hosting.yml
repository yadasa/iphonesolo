name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-keiazotilt
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build private source archive
        env:
          SOURCE_VERSION: ${{ github.sha }}
        run: |
          npm run build:distribution
          test -s functions/downloads/iphonesolo-source.zip
          unzip -t functions/downloads/iphonesolo-source.zip
          if unzip -Z1 functions/downloads/iphonesolo-source.zip | grep -Eq '^iphonesolo-source/(code/|testing/|functions/|\.github/|firebase\.json$|\.firebaserc$|plan\.md$)'; then
            echo "::error::Private deployment files leaked into the source archive."
            exit 1
          fi
          if unzip -p functions/downloads/iphonesolo-source.zip iphonesolo-source/index.html | grep -Fq 'umami.gnimoay.com'; then
            echo "::error::Analytics configuration leaked into the source archive."
            exit 1
          fi

      - name: Verify application
        run: |
          npm test
          npm run check

      - name: Install Firebase Functions dependencies
        run: npm install --prefix functions --omit=dev --no-audit --no-fund

      - name: Configure Firebase project
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEIAZOTILT }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          if (!account.project_id) throw new Error('The Firebase service account has no project_id.');
          const config = {
            projects: { default: account.project_id },
            targets: {
              [account.project_id]: {
                hosting: { keiazotilt: ['keiazotilt'] }
              }
            }
          };
          fs.writeFileSync('.firebaserc', `${JSON.stringify(config, null, 2)}\n`);
          const credentialsPath = path.join(process.env.RUNNER_TEMP, 'firebase-service-account.json');
          fs.writeFileSync(credentialsPath, `${JSON.stringify(account)}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_PROJECT_ID=${account.project_id}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${credentialsPath}\n`);
          NODE

      - name: Ensure iphonesolo.com targets keiazotilt
        continue-on-error: true
        run: |
          node <<'NODE'
          const { GoogleAuth } = require('./functions/node_modules/google-auth-library');
          const projectId = process.env.FIREBASE_PROJECT_ID;
          const domain = 'iphonesolo.com';
          const targetSite = 'keiazotilt';
          const candidateSites = [targetSite, projectId];
          const base = 'https://firebasehosting.googleapis.com/v1beta1';

          async function main() {
            const auth = new GoogleAuth({
              keyFile: process.env.GOOGLE_APPLICATION_CREDENTIALS,
              scopes: ['https://www.googleapis.com/auth/firebase.hosting'],
            });
            const client = await auth.getClient();
            const headers = await client.getRequestHeaders();

            for (const site of candidateSites) {
              const response = await fetch(
                `${base}/projects/${projectId}/sites/${site}/customDomains/${domain}`,
                { headers },
              );
              if (response.ok) {
                const current = await response.json();
                if (site !== targetSite) {
                  throw new Error(
                    `${domain} is attached to Firebase Hosting site "${site}", not "${targetSite}". Move it in Firebase Console before deleting either assignment.`,
                  );
                }
                console.log(
                  `${domain} is assigned to ${targetSite}; host=${current.hostState || 'pending'}, cert=${current.cert?.state || 'pending'}.`,
                );
                return;
              }
              if (response.status !== 404) {
                throw new Error(
                  `Unable to inspect ${domain} on ${site}: HTTP ${response.status} ${await response.text()}`,
                );
              }
            }

            const create = await fetch(
              `${base}/projects/${projectId}/sites/${targetSite}/customDomains?customDomainId=${encodeURIComponent(domain)}`,
              {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({}),
              },
            );
            if (!create.ok) {
              throw new Error(
                `Unable to attach ${domain} to ${targetSite}: HTTP ${create.status} ${await create.text()}`,
              );
            }
            const operation = await create.json();
            console.log(
              `Requested ${domain} attachment to ${targetSite}: ${operation.name || 'operation started'}.`,
            );
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Deploy live presence rules
        run: npx --yes firebase-tools deploy --only database --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Verify live presence database
        run: |
          PRESENCE_BASE="https://${FIREBASE_PROJECT_ID}-default-rtdb.firebaseio.com"
          TEST_ID="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PAYLOAD="$(printf '{\"clientId\":\"%s\",\"tabId\":\"%s\",\"seenAt\":{\".sv\":\"timestamp\"}}' "$TEST_ID" "$TEST_ID")"

          write_code="$(curl -sS -o /tmp/presence-put.json -w '%{http_code}' --max-time 20 \
            -X PUT -H 'Content-Type: application/json' --data "$PAYLOAD" \
            "${PRESENCE_BASE}/presence/${TEST_ID}.json")"
          if [ "$write_code" != "200" ]; then
            echo "::error::Presence heartbeat write failed (HTTP ${write_code}): $(cat /tmp/presence-put.json)"
            exit 1
          fi

          presence="$(curl -fsSL --max-time 20 "${PRESENCE_BASE}/presence/${TEST_ID}.json")"
          if ! printf '%s' "$presence" | grep -Fq "\"clientId\":\"${TEST_ID}\""; then
            echo "::error::Presence heartbeat could not be read back."
            exit 1
          fi

          delete_code="$(curl -sS -o /tmp/presence-delete.json -w '%{http_code}' --max-time 20 \
            -X DELETE "${PRESENCE_BASE}/presence/${TEST_ID}.json")"
          if [ "$delete_code" != "200" ]; then
            echo "::error::Presence heartbeat cleanup failed (HTTP ${delete_code})."
            exit 1
          fi
          echo "Live presence database accepts heartbeat writes, reads, and cleanup."

      - name: Validate Stripe configuration
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY is missing. Add it once under GitHub Actions repository secrets."
            exit 1
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*|sk_live_*) ;;
            *)
              echo "::error::STRIPE_SECRET_KEY does not look like a Stripe secret key."
              exit 1
              ;;
          esac
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $STRIPE_SECRET_KEY" \
            https://api.stripe.com/v1/account || true)"
          if [ "$status" != "200" ]; then
            echo "::error::Stripe rejected STRIPE_SECRET_KEY (HTTP $status). Replace the GitHub secret with a valid Stripe secret key."
            exit 1
          fi
          echo "Stripe key validated; no Stripe product, price, or webhook setup is required."

      - name: Deploy Stripe checkout functions
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          trap 'rm -f functions/.env' EXIT
          printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" > functions/.env
          chmod 600 functions/.env
          npx --yes firebase-tools@latest deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      - name: Stamp deployment
        run: printf '%s\n' "$GITHUB_SHA" > public/deploy-version.txt

      - name: Deploy keiazotilt
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEIAZOTILT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: keiazotilt
          channelId: live

      - name: Verify Stripe donation backend
        run: |
          for attempt in $(seq 1 12); do
            health="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://keiazotilt.web.app/api/code-health?sha=${GITHUB_SHA}" || true)"
            if printf '%s' "$health" | grep -Fq '"ready":true'; then
              echo "Stripe donation backend is live and authenticated."
              exit 0
            fi
            echo "Waiting for Stripe functions/Hosting rewrite propagation (attempt ${attempt}/12)..."
            sleep 5
          done
          echo "::error::Stripe backend did not become healthy after deployment."
          exit 1

      - name: Verify iphonesolo.com custom domain
        run: |
          for attempt in $(seq 1 18); do
            marker="$(curl -fsSL --max-time 15 --resolve iphonesolo.com:443:199.36.158.100 -H 'Cache-Control: no-cache' "https://iphonesolo.com/deploy-version.txt?sha=${GITHUB_SHA}" || true)"
            root_html="$(curl -fsSL --max-time 15 --resolve iphonesolo.com:443:199.36.158.100 -H 'Cache-Control: no-cache' "https://iphonesolo.com/?sha=${GITHUB_SHA}" || true)"
            code_html="$(curl -fsSL --max-time 15 --resolve iphonesolo.com:443:199.36.158.100 -H 'Cache-Control: no-cache' "https://iphonesolo.com/code?sha=${GITHUB_SHA}" || true)"
            if [ "$marker" = "$GITHUB_SHA" ] \
              && printf '%s' "$root_html" | grep -Fq '<title>iPhone Solo</title>' \
              && printf '%s' "$code_html" | grep -Fq '<title>Get the code · iPhone Solo</title>'; then
              echo "iphonesolo.com is serving Hosting commit ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for iphonesolo.com to serve ${GITHUB_SHA} (attempt ${attempt}/18)..."
            sleep 10
          done
          echo "::error::iphonesolo.com did not serve the deployed Hosting commit within the verification window."
          exit 1
